<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Decoder — teclas próximas</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --fg: #e8eaed;
      --muted: #8a92a6;
      --accent: #4f8cff;
      --accent-hover: #6aa0ff;
      --border: #262b36;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .wrap { width: 100%; max-width: 820px; }
    h1 { margin: 0 0 6px; font-size: 22px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 18px;
    }
    label { display:block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    input[type="text"], input[type="number"] {
      width: 100%;
      background: #0d0f13;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--fg);
      padding: 12px 14px;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    .row { display: flex; gap: 12px; align-items: end; margin-top: 12px; }
    .row .grow { flex: 1; }
    .row .small { width: 130px; }
    button {
      background: var(--accent);
      border: none;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: var(--accent-hover); }
    .token {
      border-top: 1px solid var(--border);
      padding: 14px 0;
    }
    .token:first-child { border-top: none; padding-top: 0; }
    .token-head {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .token-word { color: var(--fg); font-weight: 600; font-family: monospace; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: #1f2530;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 14px;
      font-family: monospace;
    }
    .chip.best {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      font-weight: 600;
    }
    .empty { color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🔎 Decoder — teclas próximas</h1>
    <div class="sub">Digite a frase “embaralhada” e veja os candidatos ordenados por frequência.</div>

    <div class="card">
      <label for="frase">Frase</label>
      <input id="frase" type="text" placeholder="ex.: nry bpkw r hpsi" autofocus>

      <div class="row">
        <div class="small">
          <label for="limite">Limite (opcional)</label>
          <input id="limite" type="number" min="1" placeholder="todos">
        </div>
        <button id="btn">Decifrar</button>
      </div>
    </div>

    <div class="card" id="resultado">
      <div class="empty">Os resultados aparecem aqui.</div>
    </div>
  </div>

  <script>
    const input = document.getElementById('frase');
    const limite = document.getElementById('limite');
    const btn = document.getElementById('btn');
    const out = document.getElementById('resultado');

    async function decifrar() {
      const frase = input.value.trim();
      if (!frase) {
        out.innerHTML = '<div class="empty">Digite algo primeiro.</div>';
        return;
      }
      out.innerHTML = '<div class="empty">Decifrando...</div>';

      try {
        const resp = await fetch('/decode', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({frase, limite: limite.value})
        });
        const data = await resp.json();
        render(data.tokens);
      } catch (e) {
        out.innerHTML = '<div class="empty">Erro ao consultar o servidor.</div>';
      }
    }

    function render(tokens) {
      if (!tokens.length) {
        out.innerHTML = '<div class="empty">Nada pra mostrar.</div>';
        return;
      }
      out.innerHTML = '';
      for (const t of tokens) {
        const div = document.createElement('div');
        div.className = 'token';

        const head = document.createElement('div');
        head.className = 'token-head';
        head.innerHTML = `<span class="token-word">${escapeHtml(t.token)}</span>
                          <span>${t.total} candidato(s)</span>`;

        const chips = document.createElement('div');
        chips.className = 'chips';

        if (t.matches.length === 0) {
          chips.innerHTML = '<span class="empty">(nenhuma)</span>';
        } else {
          t.matches.forEach((w, i) => {
            const c = document.createElement('span');
            c.className = 'chip' + (i === 0 ? ' best' : '');
            c.textContent = w;
            chips.appendChild(c);
          });
        }

        div.appendChild(head);
        div.appendChild(chips);
        out.appendChild(div);
      }
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    btn.addEventListener('click', decifrar);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') decifrar(); });
    limite.addEventListener('keydown', e => { if (e.key === 'Enter') decifrar(); });
  </script>
</body>
</html>
